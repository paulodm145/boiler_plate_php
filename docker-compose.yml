services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        # UID/GID do usuário do host, para os arquivos criados pelo
        # container terem o dono certo no bind mount.
        PUID: "1000"
        PGID: "1000"
    container_name: prb_admin_php_app
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./:/var/www/html
      # Sobrepõe só o .env dentro do container com a versão de dev/docker,
      # sem tocar no .env real do host. Escritas do instalador (EnvWriter)
      # caem direto em .env.docker no host, por ser um bind mount.
      - ./.env.docker:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prb_admin_php

  db:
    image: mysql:8.0
    container_name: prb_admin_php_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    # Precisam bater com DB_DATABASE/DB_USERNAME/DB_PASSWORD/DB_ROOT_PASSWORD
    # em .env.docker.
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - prb_admin_php_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prb_admin_php

volumes:
  prb_admin_php_mysql_data:
    name: prb_admin_php_mysql_data

networks:
  prb_admin_php:
    driver: bridge
